name: Build and publish packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Parse Build-Depends from all control files and install them.
          # debhelper-compat is a virtual; map it to debhelper.
          build_deps=$(python3 -c "
          import re, glob
          deps = {'build-essential', 'lintian', 'debconf-utils'}
          for f in sorted(glob.glob('packaging/*/debian/control')):
              for line in open(f):
                  if line.startswith('Build-Depends:'):
                      pkgs = re.sub(r'\s*\([^)]*\)', '', line.split(':',1)[1])
                      deps.update(p.strip() for p in pkgs.split(',') if p.strip())
          deps.discard('debhelper-compat')
          deps.add('debhelper')
          print(' '.join(sorted(deps)))
          ")
          sudo apt-get install -y --no-install-recommends $build_deps

      - name: Validate preseed file
        run: debconf-set-selections --checkonly preseed/paperweight.cfg

      - name: Build packages
        run: |
          for pkg_dir in packaging/*/; do
            [ -f "$pkg_dir/debian/control" ] || continue
            echo "==> Building $(basename "$pkg_dir")..."
            (cd "$pkg_dir" && dpkg-buildpackage -us -uc -b)
          done

      - name: Lint packages
        run: lintian --fail-on error packaging/*.deb

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: packaging/*.deb
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install publish dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends reprepro

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: packaging/

      - name: Import GPG signing key
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set."
            echo "::error::Export your key and add it to repo secrets:"
            echo "::error::  gpg --export-secret-keys --armor A0A521F74780A014 | base64 -w0"
            exit 1
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n'  >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
          echo "$GPG_PRIVATE_KEY" \
            | base64 -d \
            | gpg --batch --yes --import \
                  --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback
          echo "$GPG_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                  -u "$GPG_KEY_ID" --sign --output /dev/null /dev/null
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: A0A521F74780A014

      - name: Set up gh-pages worktree
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git fetch origin gh-pages
          git worktree add gh-pages-dir gh-pages

      - name: Publish to apt repo
        run: |
          mkdir -p gh-pages-dir/conf
          cp apt-repo/conf/* gh-pages-dir/conf/

          published=0
          skipped=0
          published_tags=""

          for deb in packaging/*.deb; do
            [ -f "$deb" ] || continue
            pkg_name="$(dpkg-deb -f "$deb" Package)"
            deb_ver="$(dpkg-deb -f "$deb" Version)"
            pool_ver="$(reprepro --basedir gh-pages-dir list trixie "$pkg_name" 2>/dev/null | awk '{print $NF}')"
            if [ "$pool_ver" = "$deb_ver" ]; then
              echo "  Skipping $pkg_name $deb_ver (already in pool)"
              skipped=$((skipped + 1))
              continue
            fi
            echo "  Including $(basename "$deb")..."
            reprepro --basedir gh-pages-dir includedeb trixie "$deb"
            published=$((published + 1))
            published_tags="$published_tags ${pkg_name}/${deb_ver}"
          done

          echo "published=$published"   >> "$GITHUB_ENV"
          echo "skipped=$skipped"       >> "$GITHUB_ENV"
          echo "published_tags=$published_tags" >> "$GITHUB_ENV"

          if [ "$published" -eq 0 ]; then
            echo "::notice::All packages already at current version in the apt repo. Did you forget to bump changelogs?"
          fi

      - name: Export public key
        run: |
          KEY_ID="$(grep '^SignWith:' apt-repo/conf/distributions | awk '{print $2}')"
          gpg --export "$KEY_ID" > gh-pages-dir/pubkey.gpg

      - name: Commit and push gh-pages
        run: |
          git -C gh-pages-dir add -A
          git -C gh-pages-dir commit \
            -m "Publish packages $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            || echo "(nothing changed)"
          git -C gh-pages-dir push origin gh-pages

      - name: Tag published versions
        if: env.published != '0'
        run: |
          for tag in ${{ env.published_tags }}; do
            if git tag -l "$tag" | grep -q .; then
              echo "  Tag $tag already exists — skipping"
            else
              git tag "$tag"
              echo "  Tagged $tag"
            fi
          done
          git push origin --tags
