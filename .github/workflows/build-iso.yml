name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install live-build
        run: sudo apt-get install -y live-build

      - name: Build ISO
        run: |
          cd live-build
          sudo lb clean
          sudo lb config
          sudo lb build

      - name: Rename ISO
        run: |
          ISO=$(ls live-build/*.iso | head -1)
          mv "$ISO" "paperweight-os-amd64-$(date +%Y%m%d).iso"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperweight-os-amd64
          path: "*.iso"
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.iso"
          generate_release_notes: true
