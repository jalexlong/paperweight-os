name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin isolinux \
            dosfstools mtools debian-archive-keyring

      - name: Install Debian live-build (not Ubuntu's ancient 3.x fork)
        run: |
          LB_VER="20250505+deb13u1"
          wget -q "http://deb.debian.org/debian/pool/main/l/live-build/live-build_${LB_VER}_all.deb" \
            -O /tmp/live-build.deb
          sudo dpkg -i /tmp/live-build.deb
          lb --version
          # Note: PaperweightOS GPG key is committed at
          # live-build/config/archives/paperweight-os.key.chroot
          # lb installs it to /etc/apt/trusted.gpg.d/ before apt-get update

      - name: Build ISO
        run: |
          cd live-build
          sudo lb clean
          sudo lb config
          sudo lb build

      - name: Rename ISO
        run: |
          ISO=$(ls live-build/*.iso | head -1)
          mv "$ISO" "paperweight-os-amd64-$(date +%Y%m%d).iso"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperweight-os-amd64
          path: "*.iso"
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.iso"
          generate_release_notes: true
