if loadfont $prefix/font.pf2 ; then
  set gfxmode=auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set timeout=10
set default=0

menuentry "Try PaperweightOS live" {
  set gfxpayload=keep
  linux   @KERNEL_LIVE@ @APPEND_LIVE@
  initrd  @INITRD_LIVE@
}

menuentry "Install PaperweightOS (automatic — requires internet)" {
  set gfxpayload=keep
  linux   @KERNEL_DI@ @APPEND_DI@ auto=true priority=critical preseed/file=/cdrom/preseed.cfg
  initrd  @INITRD_DI@
}

menuentry "Install PaperweightOS (manual)" {
  set gfxpayload=keep
  linux   @KERNEL_DI@ @APPEND_DI@
  initrd  @INITRD_DI@
}
