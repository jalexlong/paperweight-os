# Password manager
bindsym $mod+p exec paperweight-passmenu

# gpg-agent is socket-activated on first use and may start with an empty
# environment before this fragment runs (e.g. if pam_gnupg's login-time
# priming reaches it first) — pinentry-gtk-2 then can't find a display
# and gpg-agent times out after 60s instead of prompting. Sorts after
# 50-systemd-user.conf's environment import, so DISPLAY/WAYLAND_DISPLAY
# are already correct by the time this runs.
exec gpg-connect-agent updatestartuptty /bye >/dev/null 2>&1
