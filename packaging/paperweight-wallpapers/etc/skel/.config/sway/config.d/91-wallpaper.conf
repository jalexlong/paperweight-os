# Apply wallpaper from active theme on session start and after sway reload.
# Requires paperweight-wallpapers. Falls back to solid color (90-theme.conf)
# if no wallpaper file is found for the active theme.
exec_always sh -c '\
  theme=$(cat ~/.config/paperweight-os/active-theme 2>/dev/null || echo macchiato); \
  wp="/usr/share/paperweight-os/wallpapers/$theme.png"; \
  [ -f "$wp" ] && swaymsg "output * bg $wp fill" || true'
