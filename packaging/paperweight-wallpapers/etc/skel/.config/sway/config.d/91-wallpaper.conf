# Apply wallpaper on session start and after sway reload.
# Priority: per-theme user override > artwork default > solid color fallback.
exec_always sh -c '\
  theme=$(cat "$HOME/.config/paperweight-os/active-theme" 2>/dev/null || echo macchiato); \
  wp_file="$HOME/.config/paperweight-os/wallpapers/$theme"; \
  if [ -f "$wp_file" ]; then \
    wp=$(cat "$wp_file"); \
  elif [ -f "/usr/share/paperweight-os/wallpapers/${theme}-wallpaper1.jpg" ]; then \
    wp="/usr/share/paperweight-os/wallpapers/${theme}-wallpaper1.jpg"; \
  else \
    wp="/usr/share/paperweight-os/wallpapers/${theme}.png"; \
  fi; \
  [ -f "$wp" ] && swaymsg "output * bg $wp fill" || true'
