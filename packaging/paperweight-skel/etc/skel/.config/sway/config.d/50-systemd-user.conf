# Import Wayland session variables into the systemd user environment.
# Required for D-Bus activation, portals, and systemd user services.
# See: https://github.com/swaywm/sway/wiki/Systemd-integration

exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP

exec hash dbus-update-activation-environment 2>/dev/null && \
    dbus-update-activation-environment --systemd \
        DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP=sway
