# Idle and lock behavior
#
# `swayidle -w` waits for EVERY command to exit before handling the next
# event, not just before-sleep. A bare `gtklock` doesn't exit until you
# unlock, so the idle lock used to block swayidle entirely. A lid close
# during that time queued a PrepareForSleep signal, which swayidle only
# got to after you unlocked, and it then started a second gtklock (the
# double unlock). The 900s display-off never ran while locked either.
#
# `gtklock -d` daemonizes once the session lock is in place, so -w still
# makes sure the screen is locked before suspend but no longer blocks.
# The pgrep guard skips the lock if gtklock is already running.

exec swayidle -w \
    timeout 750 'pgrep -x gtklock >/dev/null || gtklock -d' \
    timeout 900 'swaymsg "output * power off"' \
    resume 'swaymsg "output * power on"' \
    before-sleep 'pgrep -x gtklock >/dev/null || gtklock -d' \
    lock 'pgrep -x gtklock >/dev/null || gtklock -d'
