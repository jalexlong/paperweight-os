# Workspace assignments and app keybinds
#
# $mod+key       — switch to workspace, launch app
# $mod+Shift+key — open app as floating window
#
# GUI apps with distinct app_ids are assigned to their workspace so they land
# there regardless of how they're launched (keybind, wofi, link handler, etc.)

assign [app_id="firefox"]   workspace 2
assign [app_id="discord"]   workspace 5
assign [app_id="vesktop"]   workspace 5

# Workspace 1 — Terminal
bindsym $mod+t       exec "swaymsg workspace 1 && foot"
bindsym $mod+Shift+t exec foot --app-id floating-terminal

# Workspace 2 — Browser
# MOZ_APP_REMOTINGNAME overrides the Wayland app_id so the float rule below
# matches without affecting normal Firefox windows.
bindsym $mod+b       exec "swaymsg workspace 2 && firefox-esr"
bindsym $mod+Shift+b exec env MOZ_APP_REMOTINGNAME=firefox-float firefox-esr

# Workspace 3 — Editor (helix)
bindsym $mod+e       exec "swaymsg workspace 3 && foot -e hx"
bindsym $mod+Shift+e exec foot --app-id floating-terminal -e hx

# Workspace 4 — Music (ncspot)
bindsym $mod+s       exec "swaymsg workspace 4 && foot --app-id foot-music -e ncspot"
bindsym $mod+Shift+s exec foot --app-id floating-terminal -e ncspot

# Workspace 5 — Chat (Discord/Vesktop; XMPP and IRC clients also assign here)
# Change 'discord' to 'vesktop' if using Vesktop.
bindsym $mod+c       exec "swaymsg workspace 5 && discord"
bindsym $mod+Shift+c exec sh -c 'discord & sleep 2 && swaymsg "[app_id=discord] floating enable, resize set 900 600, move position center"'

# Workspace 6 — Games/emulators (launch from wofi; no default app yet)
bindsym $mod+g exec swaymsg workspace 6

# --- Float rules for floating variants ---
# foot-based floats reuse the existing floating-terminal rule from base config
for_window [app_id="firefox-float"] floating enable, resize set 1200 700, move position center
