# Workspace assignments and app keybinds
#
# $mod+key   — switch to workspace and launch app
# $mod+Shift+t — floating terminal (only floating shortcut retained)
#
# GUI apps with distinct app_ids are assigned to their workspace so they land
# there regardless of how they're launched (keybind, wofi, link handler, etc.)

assign [app_id="firefox"]   workspace 2
assign [app_id="vesktop"]   workspace 4

# Workspace 1 — Terminal ($mod+Return in base config; $mod+Shift+t for floating)
bindsym $mod+Shift+t exec foot --app-id floating-terminal

# Workspace 2 — Browser
# MOZ_APP_REMOTINGNAME overrides the Wayland app_id so the float rule below
# matches without affecting normal Firefox windows.
bindsym $mod+b exec "swaymsg workspace 2 && firefox-esr"

# Workspace 3 — Editor (neovim)
bindsym $mod+e exec "swaymsg workspace 3 && foot -e nvim"

# Workspace 4 — Chat (Vesktop)
bindsym $mod+d exec "swaymsg workspace 4 && vesktop"

# Layout toggle — switch current workspace between tabbed and side-by-side split
bindsym $mod+s layout toggle tabbed splith

# Theme switcher
bindsym $mod+p exec paperweight-theme

# Network manager (Wi-Fi picker)
bindsym $mod+n exec paperweight-network

# --- Float rule for firefox floating variant ---
for_window [app_id="firefox-float"] floating enable, resize set 1200 700, move position center
