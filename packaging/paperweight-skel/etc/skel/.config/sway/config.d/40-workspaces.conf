# Workspace assignments and app keybinds
#
# Workspaces map to roles, not specific apps. Swap a component by changing
# $chat in sway/config — the workspace, icon, and bindings follow.
#
# GUI apps are assigned to their role workspace so they land there regardless
# of how they're launched (keybind, wofi, link handler, etc.).

# --- Browser (workspace 2) ---
assign [app_id="firefox"]         workspace 2
assign [app_id="brave-browser"]   workspace 2
assign [class="Brave-browser"]    workspace 2
assign [app_id="midori"]          workspace 2

# --- Chat (workspace 3) ---
assign [app_id="vesktop"]         workspace 3
assign [app_id="discord"]         workspace 3
assign [class="discord"]          workspace 3

# Workspace 2 — Browser
bindsym $mod+b exec "swaymsg workspace 2 && $browser"

# Workspace 3 — Chat
bindsym $mod+d exec "swaymsg workspace 3 && $chat"

# Layout toggle — switch current workspace between tabbed and side-by-side split
bindsym $mod+s layout toggle tabbed splith

# Theme switcher
bindsym $mod+t exec paperweight-theme

# Network manager (Wi-Fi picker)
bindsym $mod+n exec paperweight-network

# Float rule for firefox floating variant
for_window [app_id="firefox-float"] floating enable, resize set 1200 700, move position center
