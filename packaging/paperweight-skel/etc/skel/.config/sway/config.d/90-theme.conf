# PaperweightOS appearance — structural settings
# Color variables are defined in 90-colors.conf (managed by paperweight-theme).

font pango:JetBrainsMono Nerd Font 10

default_border pixel 2
default_floating_border pixel 2

gaps inner 6
gaps outer 3

# Solid color background — fallback until paperweight-wallpapers is installed
output * bg $base solid_color

#                       border      bg          text    indicator   child_border
client.focused          $lavender   $lavender   $crust  $lavender   $lavender
client.focused_inactive $surface1   $surface0   $text   $surface1   $surface1
client.unfocused        $surface0   $surface0   $text   $surface0   $surface0
client.urgent           $red        $red        $crust  $red        $red
client.placeholder      $surface0   $surface0   $text   $surface0   $surface0

# Float common utility windows
for_window [app_id="pavucontrol"]        floating enable
for_window [app_id="blueman-manager"]   floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [title="Picture-in-Picture"] floating enable, sticky enable

# Float browser/app dialogs
for_window [window_role="pop-up"]  floating enable
for_window [window_role="bubble"]  floating enable
for_window [window_role="dialog"]  floating enable
for_window [window_type="dialog"]  floating enable
