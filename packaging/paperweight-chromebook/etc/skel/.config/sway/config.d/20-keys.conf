input "1:1:AT_Translated_Set_2_keyboard" {
    xkb_model "chromebook"
}

# Top-row bare: F4 position → F11 (per chromebook XKB); F5 = overview key
# F6-F10 (brightness/volume) are handled via XF86 bindings in the base sway/config.
bindsym F11 fullscreen toggle
bindsym F5  layout toggle tabbed split

# $mod + top-row: inject literal F1-F10 into the focused window via wtype
bindsym $mod+XF86Back              exec wtype -k F1
bindsym $mod+XF86Forward           exec wtype -k F2
bindsym $mod+XF86Reload            exec wtype -k F3
bindsym $mod+F11                   exec wtype -k F4
bindsym $mod+F5                    exec wtype -k F5
bindsym $mod+XF86MonBrightnessDown exec wtype -k F6
bindsym $mod+XF86MonBrightnessUp   exec wtype -k F7
bindsym $mod+XF86AudioMute         exec wtype -k F8
bindsym $mod+XF86AudioLowerVolume  exec wtype -k F9
bindsym $mod+XF86AudioRaiseVolume  exec wtype -k F10
