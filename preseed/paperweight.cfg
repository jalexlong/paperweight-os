# PaperweightOS — Debian Trixie preseed
#
# Automates a base Debian install, then adds the PaperweightOS apt repo
# and installs paperweight-desktop.
#
# Usage (boot parameter or via DHCP/HTTP):
#   auto=true priority=critical url=http://<server>/paperweight.cfg
#
# Or place on a USB stick as /preseed.cfg and boot with:
#   auto=true priority=critical file=/cdrom/preseed.cfg
#
# ── CUSTOMIZE before use ────────────────────────────────────────────────────
# 1. Set the target disk (partman-auto/disk) — /dev/sda for most laptops,
#    /dev/mmcblk0 for the Dell Chromebook 11 3180 eMMC.
# 2. Set locale, timezone, and keyboard if not en_US / UTC / us.
# 3. Change the default username and password hash.
#    Generate a hash with: printf 'password' | mkpasswd -s -m sha-512
# ────────────────────────────────────────────────────────────────────────────

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP; hostname set here, domain auto-detected)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string paperweight
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
# Time out DHCPv6 immediately — libvirt NAT doesn't provide it.
d-i netcfg/dhcpv6_timeout string 1
# Skip hostname reverse-DNS lookup (no PTR records in libvirt NAT).
d-i netcfg/hostname string paperweight

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
# Skip NTP sync during install — can hang if libvirt NAT blocks UDP/123.
d-i clock-setup/ntp boolean false

### Partitioning
# Auto-detect the first available disk. Override by setting partman-auto/disk
# explicitly: /dev/sda (SATA), /dev/vda (virtio), /dev/mmcblk0 (eMMC/Chromebook).
d-i partman/early_command string \
  DISK=$(list-devices disk | head -n1); \
  debconf-set partman-auto/disk "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### User account
# CUSTOMIZE: change username and password hash.
# Default password is 'paperweight' — change it on first login.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Paperweight User
d-i passwd/username string user
# Hash for 'paperweight': replace with output of: printf 'yourpassword' | mkpasswd -s -m sha-512
d-i passwd/user-password-crypted password $6$nszgEx0srBCkMFrO$HyHitwsAyjnmFmnQ13RZe/53zQJYmkh/VY6sdTjr.ytRhrdz8lnFg2AJweM5Ie.Kty/mdGi3ZXltwjH/ZxZVO1
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo curl wget ca-certificates
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note

### Late command — add PaperweightOS repo and install desktop
d-i preseed/late_command string \
  in-target sh -c ' \
    set -e; \
    LOG=/root/paperweight-install.log; \
    exec > "$LOG" 2>&1; \
    echo "=== removing cdrom apt source ==="; \
    sed -i "/^deb cdrom:/d" /etc/apt/sources.list; \
    echo "=== fetching GPG key ==="; \
    curl -fsSL https://jalexlong.github.io/paperweight-os/pubkey.gpg \
      -o /etc/apt/trusted.gpg.d/paperweight.gpg; \
    echo "=== adding apt source ==="; \
    echo "deb https://jalexlong.github.io/paperweight-os trixie main" \
      > /etc/apt/sources.list.d/paperweight.list; \
    echo "=== apt-get update ==="; \
    apt-get update; \
    echo "=== apt-get install paperweight-desktop ==="; \
    apt-get install -y paperweight-desktop; \
    echo "=== done ==="; \
  '
